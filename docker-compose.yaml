# nginx proxy address - http://172.17.0.1:64394

name: yacy
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: yacy/yacy_search_server:latest
    container_name: yacy-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: yacy-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64394:8090'
    volumes:
      - './volumes/data/yacy:/opt/yacy_search_server/DATA:z'
    networks:
      - yacy

networks:
  yacy:
    name: yacy
    external: false
